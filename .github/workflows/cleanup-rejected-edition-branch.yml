name: One-time cleanup of rejected edition branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-rejected-edition-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete rejected temporary branch
    runs-on: ubuntu-24.04
    steps:
      - name: Delete edition-profiles
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/edition-profiles"

      - name: Remove this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/cleanup-rejected-edition-branch.yml"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}" \
            -f message="chore: remove one-time branch cleanup workflow" \
            -f sha="${sha}" \
            -f branch="main"
