name: CI

# Run for pull requests and manual dispatch on either edition branch. Builds are handled by the
# separate Android APK and Desktop builds workflows.
on:
  push:
    branches:
      - main
      - russian
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  rust:
    name: Rust (format, clippy, tests)
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        with:
          persist-credentials: false
        with:
          fetch-depth: 2
          persist-credentials: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned commit 2026-11-15
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin, aarch64-apple-ios
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The checked-out Russian fork predates the current rustfmt defaults; checking the
      # entire workspace would fail on untouched upstream files. Check the new module directly,
      # and reject whitespace errors in the complete PR diff.
      - name: Format and whitespace checks
        run: |
          rustfmt --check --edition 2024 desktop/src/language_packs.rs
          git diff --check HEAD^1 HEAD
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # the code only Apple's systems build (the Mac's pen, Finder, video, PDF and fonts; the iPad
      # app's layer and render thread), checked without linking: no Mac needed
      - name: Clippy for macOS and iPadOS
        run: |
          cargo clippy --locked --target aarch64-apple-darwin -p procraft-desktop -- -D warnings
          cargo clippy --locked --target aarch64-apple-ios -p procraft-core --lib -- -D warnings
      # the GPU tests skip themselves: the runner has no GPU
      - run: cargo test --workspace --locked

  android:
    name: Android (lint, unit tests, APK build)
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned commit 2026-11-15
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-ndk
        run: cargo install cargo-ndk --version "4.1.2" --locked
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # the code only Android builds (the surface and the render thread)
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Release APK and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Pprocraft.abis=x86_64
      - name: 16 KB pages
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          dir=$(mktemp -d)
          unzip -q "$apk" 'lib/*' -d "$dir"
          for so in "$dir"/lib/*/*.so; do
            for align in $("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((align)) -lt 16384 ]; then
                echo "$so: a segment aligned to $align"
                exit 1
              fi
            done
          done
          echo "every library's segments are aligned to 16 KB"

  gradle-wrapper:
    name: Gradle wrapper validation
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
