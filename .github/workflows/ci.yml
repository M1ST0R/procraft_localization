name: CI

# Fast validation only. Packaging is handled by dedicated release workflows.
on:
  push:
    branches:
      - main
      - russian
      - edition-profiles
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.0"

jobs:
  translation-audit:
    name: Translation coverage and language-pack validation
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/edition-profiles' || github.base_ref == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate dictionaries and sample pack
        run: python3 tools/check_translation_coverage.py

  rust-quality:
    name: Rust lint and diff hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned commit 2026-11-15
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Diff whitespace check
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
            git diff --check "$base" HEAD
          elif [ "$GITHUB_REF" = "refs/heads/edition-profiles" ]; then
            git fetch --no-tags --depth=1 origin main
            git diff --check origin/main HEAD
          else
            git diff --check HEAD^
          fi
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  desktop-tests:
    name: Desktop tests (${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [langpack, ru]
    runs-on: ubuntu-24.04
    # The profile feature is only defined by procraft-desktop, so lint it separately per edition.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned commit 2026-11-15
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Desktop translation tests
        run: cargo test --locked -p procraft-desktop translation::tests ${{ matrix.edition == 'ru' && '--no-default-features' || '--features language-packs' }}
      - name: Desktop Clippy (${{ matrix.edition }})
        run: cargo clippy --locked -p procraft-desktop --all-targets ${{ matrix.edition == 'ru' && '--no-default-features' || '--features language-packs' }} -- -D warnings
      - name: Language-pack runtime tests
        if: matrix.edition == 'langpack'
        run: cargo test --locked -p procraft-desktop language_packs::tests
      - name: Core PNG export tests
        run: cargo test --locked -p procraft-core --lib project::signature_tests

  android-tests:
    name: Android unit tests (${{ matrix.edition }})
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        edition: [langpack, ru]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned commit 2026-11-15
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "4.1.2" --locked
      - name: Install NDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null
          set -o pipefail
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Android Rust Clippy
        if: matrix.edition == 'langpack'
        run: cargo ndk -t arm64-v8a --platform 26 clippy --locked -p procraft-core --lib -- -D warnings
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android unit tests (x86_64)
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Pprocraft.abis=x86_64 -Pprocraft.edition=${{ matrix.edition }}
