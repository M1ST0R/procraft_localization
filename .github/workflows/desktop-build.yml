name: Desktop builds

on:
  push:
    branches:
      - main
      - edition-profiles
    paths:
      - "desktop/**"
      - "crates/**"
      - "plugins/**"
      - "assets/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "android/gradle.properties"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"

jobs:
  windows:
    name: Windows x64 (${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [langpack, ru]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned commit 2026-11-15
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-${{ matrix.edition }}-windows-x64

      - name: Install WiX v5
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Build and package Windows desktop
        shell: pwsh
        env:
          EDITION: ${{ matrix.edition }}
        run: ./packaging/windows/package.ps1

      - name: Create package checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          files = sorted(p for p in Path("dist").iterdir() if p.is_file() and p.name != "SHA256SUMS.txt")
          with Path("dist/SHA256SUMS.txt").open("w", encoding="utf-8", newline="\n") as manifest:
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  manifest.write(f"{digest}  {path.name}\n")
          PY

      - name: List packages
        shell: bash
        run: ls -lh dist

      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProCraft-${{ matrix.edition == 'langpack' && 'LangPack' || 'RU' }}-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x86_64 (${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [langpack, ru]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned commit 2026-11-15
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-${{ matrix.edition }}-linux-x86_64

      - name: Install verified packaging tools
        shell: bash
        run: |
          NFPM_VERSION="2.49.0"
          NFPM_SHA256="2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7"
          NFPM_ARCHIVE="$RUNNER_TEMP/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            --output "$NFPM_ARCHIVE"
          printf '%s  %s\n' "$NFPM_SHA256" "$NFPM_ARCHIVE" | sha256sum --check -
          tar -xzf "$NFPM_ARCHIVE" -C "$RUNNER_TEMP" nfpm
          sudo install -m755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils

      - name: Build and package Linux desktop
        env:
          EDITION: ${{ matrix.edition }}
        run: bash packaging/linux/package.sh

      - name: Validate packaging shell scripts
        run: |
          bash -n packaging/linux/package.sh
          bash -n packaging/linux/AppRun

      - name: Create package checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          files = sorted(p for p in Path("dist").iterdir() if p.is_file() and p.name != "SHA256SUMS.txt")
          with Path("dist/SHA256SUMS.txt").open("w", encoding="utf-8", newline="\n") as manifest:
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  manifest.write(f"{digest}  {path.name}\n")
          PY

      - name: List packages
        run: ls -lh dist

      - name: Upload Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProCraft-${{ matrix.edition == 'langpack' && 'LangPack' || 'RU' }}-Linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
