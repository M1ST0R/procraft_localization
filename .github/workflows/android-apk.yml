name: Android APK

on:
  push:
    branches:
      - main
      - russian
  pull_request:
    branches:
      - main
      - russian
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  build:
    name: Build Android APK (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned commit 2026-11-15
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-arm64

      - name: Install cargo-ndk and Android NDK
        shell: bash
        run: |
          cargo install cargo-ndk --version "4.1.2" --locked
          # sdkmanager closes stdin once it has accepted the licence; avoid treating yes' SIGPIPE
          # as a failed installation while preserving sdkmanager's own exit status.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          set -o pipefail
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Give every CI APK a strictly increasing versionCode, starting above the copied 0.0.7-beta.
      # Gradle derives versionCode from this version and checks the matching property.
      - name: Resolve CI version
        id: version
        shell: bash
        run: |
          n=$((GITHUB_RUN_NUMBER + 1))
          patch=$((7 + (n - 1) / 98))
          pre=$(((n - 1) % 98 + 1))
          base=$((patch * 100 + pre))
          echo "name=0.0.${patch}-beta.${pre}" >> "$GITHUB_OUTPUT"
          echo "code=$base" >> "$GITHUB_OUTPUT"

      - name: Configure release signing key
        if: ${{ github.ref == 'refs/heads/russian' && github.actor == github.repository_owner && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.PROCRAFT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/procraft-release.p12"
            echo "PROCRAFT_KEYSTORE=$RUNNER_TEMP/procraft-release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No PROCRAFT_KEYSTORE_BASE64 secret. APK will use the runner's temporary Android debug key; it will not update an install signed with a different key."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build signed APK (trusted branch only)
        if: ${{ github.ref == 'refs/heads/russian' && github.actor == github.repository_owner && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        working-directory: android
        env:
          PROCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PROCRAFT_KEYSTORE_PASSWORD }}
          PROCRAFT_KEY_ALIAS: ${{ secrets.PROCRAFT_KEY_ALIAS }}
          PROCRAFT_KEY_PASSWORD: ${{ secrets.PROCRAFT_KEY_PASSWORD }}
          APP_VERSION: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease \
            -Pprocraft.abis=arm64-v8a \
            "-Pprocraft.version=$APP_VERSION" \
            "-Pprocraft.versionCode=$APP_VERSION_CODE"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/ProCraft-RU-arm64.apk"

      - name: Build demo APK (debug-signed; no signing secrets)
        if: ${{ !(github.ref == 'refs/heads/russian' && github.actor == github.repository_owner && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
        working-directory: android
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease \
            -Pprocraft.abis=arm64-v8a \
            -Pprocraft.demoBuild=true \
            "-Pprocraft.version=$APP_VERSION" \
            "-Pprocraft.versionCode=$APP_VERSION_CODE"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/ProCraft-RU-Demo-arm64.apk"

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find dist -maxdepth 1 -type f -name 'ProCraft-*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee dist/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'ProCraft-LangPack-Android-arm64' || 'ProCraft-RU-Android-arm64' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/procraft-release.p12"
